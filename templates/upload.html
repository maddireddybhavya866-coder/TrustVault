{% extends "base.html" %}{% block content %}<div class="card p-4"><h2>Upload document</h2><form method="post" enctype="multipart/form-data">
<label class="form-label">Document title</label><input class="form-control mb-3" name="title" required>
<label class="form-label">Category</label><input class="form-control mb-3" name="category" required>
<label class="form-label">File (PDF, Office, TXT, PNG, JPG; max 10 MB)</label><input class="form-control mb-3" type="file" name="file" required>
<button class="btn btn-primary">Upload securely</button> <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Cancel</a></form></div>{% endblock %}
